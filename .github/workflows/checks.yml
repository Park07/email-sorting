name: Classifier checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '${{ matrix.python }}'
      - name: Run offline and mocked-provider checks
        run: python3 -B -m unittest discover -s tests -v
      - name: Run fictional examples without network
        run: python3 -B classifier.py --json
      - name: Measure rule limitations on fictional examples
        run: python3 -B evaluate.py
